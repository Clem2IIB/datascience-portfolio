[project]
name = "datascience-portfolio"
version = "1.0.0"
description = "Data science projects in Jupyter notebooks: machine learning, a RAG chatbot and data visualization."
readme = "README.md"
requires-python = ">=3.13"
# Same libraries and versions as requirements.txt.
# The Shakespeare chatbot has its own requirements.txt in its folder.
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "plotly==7.1.0",
    "jupyter",
]

[tool.uv]
# This repository is a collection of notebooks, not a package to install.
package = false
